# Keeps the Supabase project from auto-pausing on the free plan.
# The free tier pauses a project after ~7 days with no activity, which
# takes the login/dashboards offline. This pings the REST API on a
# schedule so the database stays active.
name: Supabase keep-alive

on:
  schedule:
    # Every 3 days at 06:17 UTC (odd minute avoids cron congestion).
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/announcements?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $code"
          # Any HTTP response (even 200 with an empty body under RLS) means
          # the database was reached, which is what keeps it from pausing.
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "No response from Supabase" >&2
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
